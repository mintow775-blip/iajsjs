<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Dashboard - AR X Mine</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/phase3.css">
  <link rel="stylesheet" href="/css/dash.css">
  <link rel="stylesheet" href="/css/minecraft-theme.css">
</head>
<body data-dash="developer" data-nofooter>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="navbar-logo"><img src="/assets/logos/logo.svg" alt="AR X Mine"></a>
      <div class="navbar-actions"></div>
    </div>
  </nav>
  <div class="dash-page">
    <div class="dash-grid">
      <aside>
        <div class="glass-card dashboard-sidebar">
          <div class="dash-head">
            <img id="dash-avatar" src="/assets/images/default-avatar.svg" alt="">
            <div>
              <h3 id="dash-name" style="margin-bottom:4px"></h3>
              <span class="badge badge-primary" id="dash-role">Developer</span>
            </div>
          </div>
          <nav><ul class="dashboard-nav" id="dash-nav"></ul></nav>
        </div>
      </aside>
      <main id="dash-main"><div class="p3-muted" style="padding:24px">Checking your session…</div></main>
    </div>
  </div>
  <script src="/js/config/config.js"></script>
  <script src="/js/services/auth.js"></script>
  <script src="/js/config/firebase-config.js"></script>
  <script type="module" src="/js/services/firebase.js"></script>
  <script src="/js/components/ui.js"></script>
  <script src="/js/components/kit.js"></script>
  <script src="/js/pages/dashboards.js"></script>
</body>
</html>
