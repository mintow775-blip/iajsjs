<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AR X Mine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/minecraft-theme.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="navbar-logo">
        <img src="/assets/logos/logo.svg" alt="AR X Mine">
      </a>
      <div class="navbar-actions">
        <a href="/pages/register.html" class="btn btn-secondary btn-sm">Sign Up</a>
      </div>
    </div>
  </nav>

  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: calc(80px + var(--space-xl)) var(--space-lg) var(--space-xl);">
    <div class="glass-card" style="max-width: 450px; width: 100%; padding: var(--space-2xl);">
      <div style="text-align: center; margin-bottom: var(--space-2xl);">
        <h1 style="margin-bottom: var(--space-sm);">Welcome Back</h1>
        <p style="color: var(--color-text-secondary);">Login to your AR X Mine account</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Email</label>
          <input type="email" id="username" class="input" placeholder="you@example.com" autocomplete="email" inputmode="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="input" placeholder="Enter password" autocomplete="current-password" required>
          <a href="/pages/forgot-password.html" class="form-hint" style="color: var(--color-primary); text-decoration: none;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: var(--space-md);">
          Login
        </button>
        </div>

        <p style="text-align: center; color: var(--color-text-secondary); font-size: var(--text-sm);">
          Don't have an account? 
          <a href="/pages/register.html" style="color: var(--color-primary); font-weight: 600;">Sign up</a>
        </p>
      </form>
    </div>
  </div>

  <script src="/js/config/config.js"></script>
  <script src="/js/services/auth.js"></script>
  <script src="/js/config/firebase-config.js"></script>
  <script type="module" src="/js/services/firebase.js"></script>
  <script src="/js/components/ui.js"></script>
  <script>
    const next = (() => { const n = new URLSearchParams(location.search).get('next'); return n && /^\/(?!\/)/.test(n) ? n : '/pages/dashboard.html'; })();
    // Already signed in? Skip the form.
    window.ARX_READY.then(() => { if (window.ARX_BACKEND && window.ARX_BACKEND.auth.currentUser) location.replace(next); });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      const result = await window.authService.login(document.getElementById('username').value, document.getElementById('password').value);
      if (result.success) {
        window.Utils.showToast('Login successful! Redirecting...', 'success');
        const u = result.user;
        const to = u.role === 'admin' && next === '/pages/dashboard.html' ? '/pages/admin-dashboard.html' : next;
        setTimeout(() => { location.href = u.needsVerify ? '/pages/verify-email.html' : to; }, 500);
      } else {
        window.Utils.showToast(result.error || 'Login failed', 'error');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
