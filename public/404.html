<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | AR X Mine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl);
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 10rem);
      font-family: var(--font-heading);
      background: linear-gradient(135deg, var(--color-light-emerald), var(--color-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--space-lg);
      line-height: 1;
    }
    .error-title {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-md);
    }
    .error-message {
      font-size: var(--text-lg);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2xl);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .error-icon {
      font-size: 8rem;
      margin-bottom: var(--space-xl);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
  </style>
  <link rel="stylesheet" href="/css/minecraft-theme.css">
</head>
<body>
  <div class="error-container">
    <div>
      <div class="error-icon">🎮</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-message">
        Oops! The page you're looking for doesn't exist. 
        Maybe it was moved, deleted, or you mistyped the URL.
      </p>
      <div style="display: flex; gap: var(--space-md); justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn-primary btn-lg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Back to Home
        </a>
        <a href="/pages/discover.html" class="btn btn-outline btn-lg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          Explore Projects
        </a>
      </div>
    </div>
  </div>
</body>
</html>
