name: Unzip project upload

on:
  push:
    branches: [main, master]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and move files to repo root
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip in repo root. Nothing to do."
            exit 0
          fi
          ZIP=$(ls -t *.zip | head -n1)
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$ZIP" -d /tmp/x
          rm -rf /tmp/x/__MACOSX
          SRC=/tmp/x
          n_dirs=$(find /tmp/x -mindepth 1 -maxdepth 1 -type d | wc -l)
          n_files=$(find /tmp/x -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$n_dirs" -eq 1 ] && [ "$n_files" -eq 0 ]; then
            SRC=$(find /tmp/x -mindepth 1 -maxdepth 1 -type d)
          fi
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='*.zip' "$SRC"/ ./
          rm -f -- *.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update project from $ZIP"
          git push
